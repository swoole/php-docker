name: Build Versioned Images

on:
  workflow_dispatch:
  pull_request:
    paths:
      - generator
      - templates/debian.php
      - '8.*/Dockerfile'
      - .github/workflows/debian.yml
  push:
    branches:
      - master

jobs:
  Debian:
    if: ${{ github.repository == 'swoole/php-docker' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5', '8.2-zts', '8.3-zts', '8.4-zts', '8.5-zts']

    name: PHP-${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image phpswoole/php:${{ matrix.php }}
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.php }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: |
            phpswoole/php:${{ matrix.php }}
            phpswoole/php:${{ matrix.php }}-trixie

      - name: Verify Debian and libcurl versions
        run: |
          docker run --rm phpswoole/php:${{ matrix.php }}-trixie sh -ec '
            . /etc/os-release
            test "$VERSION_CODENAME" = trixie
            php -r '\''$curl = curl_version(); echo "libcurl: {$curl["version"]}\n"; exit(version_compare($curl["version"], "8.0.0", "<") || !($curl["features"] & CURL_VERSION_HTTP2) ? 1 : 0);'\''
          '

      - name: Image digest of phpswoole/php:${{ matrix.php }}
        run: echo ${{ steps.docker_build.outputs.digest }}
